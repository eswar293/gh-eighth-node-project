name: 'Get & Cache Dependencies'
description: Creating Custom Cache Dependencies
inputs:
  demo-caching: 
    description: 'Adding input values for caching dependencies'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - name: Cache dependencies
      if: inputs.demo-caching == 'true'
      id: cache
      uses: actions/cache@v6
      with:
        path: node_modules
        key: deps-node-modules-${{ hashFiles('**/package-lock.json') }}
    - name: Install dependencies
      if: steps.cache.outputs.cache-hit != 'true' || inputs.demo-caching != 'true'
      run: npm ci
      shell: bash